<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Vibes | Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Aesthetic Vibes</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Latest Collection</h2>
        <div class="product-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="image-placeholder">Red Knitted Polo Sweater</div>
                <h3>Fuzzy Red Polo Sweater</h3>
                <p class="price">$45.00</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="image-placeholder">Dark Formal Shirt</div>
                <h3>Dark Black Formal Shirt</h3>
                <p class="price">$35.00</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <div class="image-placeholder">Loose White Pants</div>
                <h3>Loose White Trousers</h3>
                <p class="price">$40.00</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
