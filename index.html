<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyShop - Online Shopping</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<header class="header">

    <div class="logo">
        🛍️ MyShop
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            oninput="searchProducts()"
        >
        🔍
    </div>

    <button class="cart-btn" onclick="openCart()">
        🛒 Cart
        <span id="cartCount">0</span>
    </button>

</header>


<section class="hero">

    <div>
        <p class="small-title">WELCOME TO MYSHOP</p>

        <h1>
            Shop Everything<br>
            You Love ❤️
        </h1>

        <p>
            Quality products at affordable prices.
        </p>

        <button onclick="scrollToProducts()" class="shop-btn">
            Shop Now →
        </button>
    </div>

</section>


<section class="categories">

    <button onclick="filterCategory('all')">
        All
    </button>

    <button onclick="filterCategory('electronics')">
        📱 Electronics
    </button>

    <button onclick="filterCategory('fashion')">
        👕 Fashion
    </button>

    <button onclick="filterCategory('home')">
        🏠 Home
    </button>

</section>


<main id="productsSection">

    <div class="section-title">
        <h2>Popular Products</h2>
        <span id="productTotal"></span>
    </div>

    <div id="productGrid" class="product-grid"></div>

</main>


<!-- CART -->

<div id="cartModal" class="modal">

    <div class="cart-container">

        <button class="close-btn" onclick="closeCart()">
            ✕
        </button>

        <h2>🛒 Your Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-bottom">

            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button
                class="checkout-btn"
                onclick="checkout()"
            >
                💳 Checkout
            </button>

        </div>

    </div>

</div>


<!-- CHECKOUT -->

<div id="checkoutModal" class="modal">

    <div class="checkout-container">

        <button class="close-btn" onclick="closeCheckout()">
            ✕
        </button>

        <h2>📦 Delivery Details</h2>

        <input
            id="customerName"
            type="text"
            placeholder="Full Name"
        >

        <input
            id="customerPhone"
            type="tel"
            placeholder="Phone Number"
        >

        <textarea
            id="customerAddress"
            placeholder="Full Delivery Address"
        ></textarea>

        <button
            class="checkout-btn"
            onclick="startPayment()"
        >
            Pay with Razorpay
        </button>

    </div>

</div>


<footer>

    <h3>🛍️ MyShop</h3>

    <p>
        Your simple online shopping destination.
    </p>

    <p>
        © 2026 MyShop. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
